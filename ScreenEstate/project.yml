name: ScreenEstate
options:
  bundleIdPrefix: com.wilsonlin
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  ScreenEstate:
    type: application
    platform: macOS
    sources:
      - path: ScreenEstate
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        CODE_SIGN_ENTITLEMENTS: ScreenEstate/ScreenEstate.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.wilsonlin.ScreenEstate
        ENABLE_APP_SANDBOX: false
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    info:
      path: ScreenEstate/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Screen Estate
        CFBundleDisplayName: Screen Estate
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
  ScreenEstateTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScreenEstateTests
    dependencies:
      - target: ScreenEstate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wilsonlin.ScreenEstateTests
        GENERATE_INFOPLIST_FILE: true
