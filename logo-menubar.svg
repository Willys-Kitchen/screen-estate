<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Transparent background - template image, system applies tinting -->

  <!-- House roof -->
  <path d="M 10 42 L 50 8 L 90 42"
        fill="none"
        stroke="black"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Monitor bezel -->
  <rect x="16" y="40" width="68" height="38" rx="4"
        fill="white"
        stroke="black"
        stroke-width="6"/>

  <!-- Grid horizontal line -->
  <line x1="16" y1="59" x2="84" y2="59"
        stroke="black" stroke-width="6"/>

  <!-- Grid vertical line -->
  <line x1="50" y1="40" x2="50" y2="78"
        stroke="black" stroke-width="6"/>

  <!-- Stand neck -->
  <line x1="50" y1="78" x2="50" y2="86"
        stroke="black" stroke-width="6" stroke-linecap="round"/>

  <!-- Stand base -->
  <line x1="36" y1="89" x2="64" y2="89"
        stroke="black" stroke-width="6" stroke-linecap="round"/>
</svg>
