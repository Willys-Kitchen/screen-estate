<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Template image: black = visible, transparent = clear -->

  <!-- House roof -->
  <path d="M 10 42 L 50 8 L 90 42"
        fill="none"
        stroke="black"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Monitor frame (outer rectangle) -->
  <rect x="16" y="40" width="68" height="38" rx="4"
        fill="none"
        stroke="black"
        stroke-width="6"/>

  <!-- Grid cross - horizontal bar -->
  <line x1="16" y1="59" x2="84" y2="59" stroke="black" stroke-width="8"/>

  <!-- Grid cross - vertical bar -->
  <line x1="50" y1="40" x2="50" y2="78" stroke="black" stroke-width="8"/>

  <!-- Stand neck -->
  <line x1="50" y1="78" x2="50" y2="88"
        stroke="black" stroke-width="6" stroke-linecap="round"/>

  <!-- Stand base -->
  <line x1="34" y1="92" x2="66" y2="92"
        stroke="black" stroke-width="6" stroke-linecap="round"/>
</svg>
